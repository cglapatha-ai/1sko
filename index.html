<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1sko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a registrar's ledger. Summary ruler on top, class list on the left, one class sheet on the right. */
:root{
  --paper:#f5f7f3; --surface:#ffffff; --ink:#1a211c; --muted:#5b665e; --line:#dbe1d8;
  --accent:#7b1113; --accent-soft:#f3e4e4;
  --good:#014421; --good-soft:#e1efe6; --warn:#8a5a00; --warn-soft:#f7ecd2; --crit:#b4380f; --crit-soft:#fae4da;
  --green:#014421; --green-soft:#e1efe6;
  --display:"Plus Jakarta Sans","Nunito",system-ui,-apple-system,sans-serif;
  --body:"Plus Jakarta Sans","Nunito",system-ui,-apple-system,sans-serif;
  --mono:"Plus Jakarta Sans","Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
/* Dark colors, used only when you switch them on with the button in the footer */
:root[data-mode="dark"]{
  --paper:#111512; --surface:#191f1b; --ink:#e8ede8; --muted:#98a59b; --line:#2b352e;
  --accent:#e58d8f; --accent-soft:#3a2021; --green:#7fd0a2; --green-soft:#18301f;
  --good:#74cc9d; --good-soft:#18301f; --warn:#e2b45a; --warn-soft:#352b12; --crit:#f29272; --crit-soft:#3a2118;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:1180px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top summary */
.top{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:200px}
.brand h1{font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gwa{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gwa.empty{color:var(--line)}
.ruler-wrap{flex:1 1 380px;display:flex;flex-direction:column;gap:10px;min-width:260px}
.verdict{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ruler{position:relative;height:54px}
.ruler .track{position:absolute;left:0;right:0;top:22px;height:2px;background:var(--ink)}
.ruler .tick{position:absolute;top:16px;width:1px;height:14px;background:var(--ink);transform:translateX(-.5px)}
.ruler .tick span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.ruler .tick:first-child span{transform:none;left:0}
.ruler .tick:last-child span{transform:translateX(-100%)}
.ruler .zone{position:absolute;left:0;top:19px;height:8px;background:var(--good-soft);border-left:0}
.ruler .target{position:absolute;top:2px;height:26px;width:2px;background:var(--good);transform:translateX(-1px)}
.ruler .target::before{content:"target";position:absolute;top:-4px;left:6px;font-size:11px;color:var(--good);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.ruler .mark{position:absolute;top:12px;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--paper);transform:translateX(-50%);box-shadow:0 0 0 1.5px var(--accent)}
.target-field{display:flex;align-items:center;gap:8px}
.target-field input{width:74px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.plain{border-color:var(--line);color:var(--muted)}

/* Notices */
.notice{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:10px 14px}
.notice p{margin:0;max-width:65ch}

/* Columns */
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
.rail{display:flex;flex-direction:column;gap:24px;min-width:0}
.rail h2,.sheet h3{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:10px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.class-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.class-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-left:4px solid transparent;padding:10px 10px 10px 10px}
.class-item:hover{background:var(--surface)}
.class-item[aria-current="true"]{background:var(--surface);border-left-color:var(--accent)}
.class-item .code{font-family:var(--display);font-weight:700;font-size:17px;overflow-wrap:anywhere}
.class-item .ttl{grid-column:1;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.class-item .g{grid-row:1 / span 2;grid-column:2;align-self:center;font-family:var(--mono);font-size:20px;font-weight:600}
.class-item .bar{grid-column:1 / -1;height:3px;background:var(--line);margin-top:6px}
.class-item .bar i{display:block;height:100%;background:var(--ink)}
.due-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.due-item{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 2px}
.due-item:hover{background:var(--surface)}
.due-item b{font-weight:500;overflow-wrap:anywhere}
.due-item .when{font-family:var(--mono);font-size:12px;white-space:nowrap}
.due-item .when.late{color:var(--crit);font-weight:600}

/* Sheet */
.sheet{background:var(--surface);border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:26px;min-width:0}
.sheet-head{display:flex;flex-direction:column;gap:6px}
.sheet-head .row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
input,select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:0;padding:5px 6px;min-width:0;width:100%}
input:hover,select:hover{border-color:var(--line)}
input:focus,select:focus{background:var(--paper)}
input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent);padding:0}
input.num,input[type="number"],input[type="date"]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input.code-in{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.01em;padding:2px 6px;flex:1 1 220px}
input.units-in{width:64px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v.big{color:var(--accent)}
.section{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--ink);background:var(--surface);padding:5px 12px;font-weight:600;font-size:13px;border-radius:2px}
.btn:hover{background:var(--ink);color:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.danger:hover{background:var(--crit);color:var(--surface)}
.x{border:0;background:none;color:var(--muted);width:28px;height:28px;border-radius:2px;font-size:18px;line-height:1}
.x:hover{background:var(--crit-soft);color:var(--crit)}
.rows{display:flex;flex-direction:column}
.row-head{font-size:12px;color:var(--muted);border-bottom:1px solid var(--ink);padding-bottom:4px}
.comp{display:grid;grid-template-columns:minmax(120px,1fr) 96px 110px 28px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0}
.comp .avg{font-family:var(--mono);text-align:right;padding-right:4px}
.wt{display:flex;align-items:center;gap:2px}
.total-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding-top:8px}
.req{display:grid;grid-template-columns:22px minmax(130px,1.5fr) minmax(110px,1fr) 132px 138px 92px 28px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0}
.req.is-done .r-name input{color:var(--muted)}
.score{display:flex;align-items:center;gap:2px}
.score span{color:var(--muted)}
.scale{display:grid;grid-template-columns:86px 96px minmax(0,1fr) 28px;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:3px 0}
.scale.now{background:var(--accent-soft)}
.scale .need{font-size:14px}
.empty{border:1px dashed var(--line);padding:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty p{margin:0;max-width:60ch}
.foot{align-items:center;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.loading [data-lock]{opacity:.55;pointer-events:none}


/* Rounded shapes and brand layer */
.num,.gwa,.stat .v,.class-item .g{font-variant-numeric:tabular-nums}
.btn,.cta{border-radius:999px}
.btn{padding:6px 14px}
.sheet{border-radius:22px}
.stats{border-radius:14px;overflow:hidden}
.notice{border-radius:14px;border-left:0}
.empty{border-radius:22px}
input,select{border-radius:8px}
.class-item{border-radius:12px;border-bottom-color:transparent;border-left-width:0;padding:10px 12px}
.class-list{border-top:0;gap:4px}
.class-item[aria-current="true"]{box-shadow:inset 4px 0 0 var(--accent)}
.class-item .bar,.class-item .bar i{border-radius:3px}
.class-item .bar i{background:var(--green)}
.scale.now{border-radius:8px}
.top{border-bottom-color:var(--green)}
.brand h1 a{color:inherit;text-decoration:none}
.brand h1{letter-spacing:.02em;text-transform:none;font-size:17px;font-weight:800}
.gwa{letter-spacing:-.04em}
.ruler .track,.ruler .tick{background:var(--green)}

.logo{align-items:baseline !important;gap:0 !important;font-size:34px !important;letter-spacing:-.04em !important}
.logo-1{height:1.05em;width:auto;flex:none;margin-right:.04em;overflow:visible}
.brand h1 .logo{font-size:28px !important}
/* Landing page */
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--accent);text-decoration:none;letter-spacing:-.01em}
.mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--surface);font-weight:800;font-size:15px;letter-spacing:-.02em}
.l-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.cta{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--surface);font-weight:700;font-size:17px;padding:14px 28px;text-decoration:none;border:0}
.cta:hover{filter:brightness(1.12)}
.cta.sm{font-size:14px;padding:9px 18px}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:36px 48px;align-items:center;padding:36px 0 20px}
.hero-copy{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;font-weight:600;font-size:14px;color:var(--green)}
.badge b{background:var(--green);color:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hero h2{font-size:clamp(40px,6.2vw,76px);font-weight:800;line-height:1.02;letter-spacing:-.035em;color:var(--accent)}
.hero h2 em{font-style:normal;color:var(--green);display:block}
.hero p.lead{margin:0;font-size:19px;color:var(--muted);max-width:44ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 18px 40px -28px var(--green)}
.preview .k{font-size:13px;font-weight:600;color:var(--muted)}
.preview .big{font-size:68px;font-weight:800;letter-spacing:-.04em;line-height:.95;color:var(--green);font-variant-numeric:tabular-nums}
.preview ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.preview li{display:flex;justify-content:space-between;gap:12px;background:var(--paper);border-radius:12px;padding:8px 14px;font-weight:600}
.preview li span{overflow-wrap:anywhere}
.preview .next{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:2px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.step{background:var(--green-soft);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:8px}
.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:var(--surface);font-weight:800}
.step h3{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.step p{margin:0;color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding-top:16px}}
/* Schedule tab */
.sched{display:flex;flex-direction:column;gap:30px}
.sched h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.wk-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 16px 24px}
.wk{display:grid;gap:0 6px;min-width:600px}
.wk-day{font-size:13px;font-weight:700;color:var(--muted);text-align:center;padding-bottom:12px}
.wk-day.today{color:var(--accent)}
.wk-body{position:relative;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 56px);border-bottom:1px solid var(--line)}
.wk-times{background:none;border:0}
.wk-times span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.wk-block{position:absolute;box-sizing:border-box;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface));border-radius:10px;padding:5px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;font-size:12px;line-height:1.25;color:var(--ink)}
.wk-block b{font-size:13px;font-weight:800}
.wk-block:hover{background:color-mix(in srgb,var(--c) 30%,var(--surface))}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cal-nav{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cal-nav h3,.panel h3{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);text-transform:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal-cell{min-height:92px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;align-items:stretch;min-width:0}
button.cal-cell:hover{border-color:var(--green)}
.cal-cell.off{border-color:transparent;background:none}
.cal-cell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-n{font-size:13px;font-weight:700;width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.cal-cell.today .cal-n{background:var(--accent);color:var(--surface)}
.cal-items{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-pill{display:flex;align-items:center;gap:4px;font-size:11px;line-height:1.35;min-width:0}
.cal-pill::before,.dot{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.cal-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-pill.done span,.drow.done b{text-decoration:line-through;color:var(--muted)}
.cal-more{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.p-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;font-size:14px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:4px 6px;border-bottom:1px solid var(--line);padding:6px 0}
.erow>input{font-weight:700}
.e-sub{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:4px 6px}
.crow{display:grid;grid-template-columns:10px 96px minmax(0,1fr) 28px;gap:8px;align-items:center}
.mrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.mrow input[type="time"]{width:132px}
.mrow input.room{flex:1 1 120px;width:auto}
.days{display:flex;gap:4px;flex-wrap:wrap}
.day{width:36px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.day.on{background:var(--green);border-color:var(--green);color:var(--surface)}
@media (max-width:900px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.cal-cell{min-height:56px;padding:3px}.cal-items{flex-direction:row;flex-wrap:wrap;gap:3px}.cal-pill span,.cal-more{display:none}}
/* Curriculum, semesters and graduation progress */
.grad{display:flex;flex-direction:column;gap:8px}
.grad-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.grad-head b{font-size:18px;font-weight:800}
.gbar{display:flex;height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.gbar i{display:block;height:100%}
.gbar .e{background:var(--green)}
.gbar .p{background:var(--accent)}
.gbar .f{background:repeating-linear-gradient(135deg,var(--green) 0 3px,var(--green-soft) 3px 7px)}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--line)}
.legend .e::before{background:var(--green)}
.legend .p::before{background:var(--accent)}
.legend .f::before{background:repeating-linear-gradient(135deg,var(--green) 0 2px,var(--green-soft) 2px 4px)}
.tabs{display:inline-flex;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.tabs a{padding:7px 20px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--surface)}
.plan{display:flex;flex-direction:column;gap:18px}
.plan-set{display:flex;flex-wrap:wrap;gap:12px 24px}
.plan-set label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);flex:0 1 230px}
.plan-set label.grow{flex:1 1 280px}
.plan-set input{font-size:17px;font-weight:700}
.term{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.term.present{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.term.planned{border-style:dashed}
.term-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.term-head input.t-name{font-weight:800;font-size:20px;flex:1 1 220px;letter-spacing:-.01em}
.term-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.term-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.p-main{flex:1 1 300px;display:grid;grid-template-columns:minmax(90px,160px) minmax(0,1fr);gap:8px;min-width:0}
.p-main input:first-child{font-weight:700}
.p-side{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:0 0 auto;width:510px}
.p-side>input.num:first-child,.p-head .p-side>span:first-child{width:64px}
.p-side>input.num:nth-child(2),.p-side>span.muted,.p-head .p-side>span:nth-child(2){width:104px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
.switches{display:flex;flex-wrap:wrap;gap:4px 18px}
/* On/off switches */
input[type="checkbox"].tog{-webkit-appearance:none;appearance:none;flex:none;width:38px;height:22px;border:0;border-radius:999px;background:var(--line);position:relative;cursor:pointer;padding:0;transition:background .15s}
input[type="checkbox"].tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
input[type="checkbox"].tog:checked{background:var(--green)}
input[type="checkbox"].tog:checked::after{transform:translateX(16px)}
input[type="checkbox"].tog:hover{border:0}
.major{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.major .m-k{font-weight:800;color:var(--accent)}
.major b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.p-count{display:flex;justify-content:center}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);align-self:flex-start;padding:2px 6px;cursor:pointer}
.p-head span{padding:0 6px}
.term-pick select{border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-weight:700;background:var(--surface)}
.mini{display:flex;align-items:center;gap:6px}
.ruler.has-band{height:82px}
.bands{position:absolute;left:0;right:0;top:58px;height:22px}
.band{position:absolute;top:0;height:22px;box-sizing:border-box;border-radius:6px;border:1px solid var(--paper);font-size:11px;font-weight:700;line-height:20px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;color:var(--green)}
.band.s{background:var(--green);color:var(--surface)}
.band.m{background:color-mix(in srgb,var(--green) 30%,var(--surface))}
.band.c{background:color-mix(in srgb,var(--green) 13%,var(--surface))}
.plan-set label.tiny{flex:0 1 150px}
.tab-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.byline{margin:0;font-weight:700;color:var(--green);font-size:15px}
.foot .by{font-weight:700;color:var(--accent)}
textarea.notebook{font:inherit;color:var(--ink);width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:0 16px;line-height:30px;background-color:var(--surface);background-image:repeating-linear-gradient(transparent 0 29px,var(--line) 29px 30px);background-attachment:local}
textarea.notebook:focus{border-color:var(--green)}
.lrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.lrow input:first-child{flex:1 1 160px;font-weight:600}
.lrow input[type="url"]{flex:2 1 220px}
.lrow a.btn{text-decoration:none;color:var(--ink)}
.lrow a.btn:hover{color:var(--surface)}
input.final-in{width:92px}
@media (max-width:720px){.p-head{display:none}.term{padding:16px}.p-side{width:auto}}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .gwa{font-size:64px}
}
@media (max-width:720px){
  .sheet{padding:16px}
  .req{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 28px;padding:8px 0}
  .req .r-name{grid-column:2 / 4}
  .req .r-del{grid-column:4;grid-row:1}
  .req .r-comp{grid-column:2}
  .req .r-score{grid-column:3}
  .req .r-due{grid-column:2}
  .req .r-stat{grid-column:3}
  .req-head{display:none}
  .comp{grid-template-columns:minmax(0,1fr) 84px 70px 28px}
  input.code-in{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){
  .ruler .mark{transition:left .35s ease}
}
</style>

<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";
var KEY="academic-tracker-v1";
var NAME="1sko"; /* change the site name here */
var AUTHOR="Chantela Jessette Lapatha";
var DEFAULT_SCALE=[[1,96],[1.25,92],[1.5,88],[1.75,84],[2,80],[2.25,76],[2.5,72],[2.75,68],[3,60]];
var state=null, selTerm=null, selected=null, loading=true, mode="local", saveState="idle", confirmDel=null;
var docRef=null, saveTimer=null, writing=false, dirty=false;
var PALETTE=[["Maroon","#7b1113"],["Green","#1d6b43"],["Blue","#1f5fa8"],["Gold","#b7791f"],["Purple","#6b3fa0"],["Teal","#0f766e"],["Pink","#b83280"],["Orange","#c2410c"]];
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DAY2=["Su","Mo","Tu","We","Th","Fr","Sa"];
var _now=new Date(), calY=_now.getFullYear(), calM=_now.getMonth(), calSel=null;
var app=document.getElementById("app");

function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function inDays(n){var d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function num(v){if(v===""||v==null)return null;var n=parseFloat(v);return isFinite(n)?n:null}
function defaultScale(){return DEFAULT_SCALE.map(function(r){return{grade:r[0],min:r[1]}})}
function view(){return location.hash==="#plan"?"plan":location.hash==="#tracker"?"tracker":location.hash==="#schedule"?"schedule":"home"}

/* ---- data shapes ---- */
function newClass(code,units,fin){
  return{id:uid(),code:code||"New class",title:"",units:units==null?3:units,final:fin==null?null:fin,
    components:[{id:uid(),name:"Exams",weight:50},{id:uid(),name:"Papers and problem sets",weight:30},{id:uid(),name:"Participation",weight:20}],
    scale:defaultScale(),reqs:[],notes:"",links:[],meets:[]};
}
function newTerm(name){return{id:uid(),name:name||"New semester",classes:[]}}
function exampleState(){
  var a=uid(),b=uid(),c=uid(),d=uid();
  var past=newTerm("First semester (sample)");
  past.classes=[newClass("SAMPLE 11",3,1.5),newClass("SAMPLE 12",3,1.75),newClass("SAMPLE 13",5,2),newClass("SAMPLE PE",2,1.25)];
  past.classes[3].excluded=true;past.classes[3].title="Example of a class that does not count";
  var now=newTerm("Second semester (sample)");
  now.classes=[{id:uid(),code:"SAMPLE 101",title:"Example class. Rename it or delete it.",units:3,final:null,
    components:[{id:a,name:"Long exams",weight:50},{id:b,name:"Problem sets",weight:20},{id:c,name:"Final paper",weight:20},{id:d,name:"Class participation",weight:10}],
    scale:defaultScale(),
    reqs:[
      {id:uid(),name:"Long exam 1",compId:a,score:84,max:100,due:inDays(-21),done:true},
      {id:uid(),name:"Problem set 1",compId:b,score:18,max:20,due:inDays(-14),done:true},
      {id:uid(),name:"Problem set 2",compId:b,score:null,max:20,due:inDays(5),done:false},
      {id:uid(),name:"Long exam 2",compId:a,score:null,max:100,due:inDays(19),done:false},
      {id:uid(),name:"Final paper",compId:c,score:null,max:100,due:inDays(30),done:false}
    ],notes:"Long exam 2 covers chapters 5 to 8.\nAsk about the final paper format on Monday.",
    links:[{id:uid(),label:"Syllabus (example link)",url:"https://example.com/syllabus"}]},newClass("SAMPLE 102",3)];
  var next=newTerm("Third semester (sample)");
  next.classes=[newClass("SAMPLE 121",3),newClass("SAMPLE 122",3)];
  now.classes[0].meets=[{id:uid(),days:[2,4],start:"08:30",end:"10:00",room:"Room 101"}];
  now.classes[1].meets=[{id:uid(),days:[1,3],start:"13:00",end:"14:30",room:"Room 204"}];
  var orgCat=uid();
  return{categories:[{id:uid(),name:"Academics",color:PALETTE[0][1]},{id:orgCat,name:"Org",color:PALETTE[1][1]},{id:uid(),name:"Personal",color:PALETTE[2][1]}],
    events:[{id:uid(),title:"General assembly (sample event)",date:inDays(3),start:"17:00",end:"18:30",catId:orgCat}],
    v:2,target:1.75,unitsRequired:166,program:"",honors:{summa:1.25,magna:1.45,cum:1.75},majorLabel:"Major GWA",majorReq:null,example:true,currentTermId:now.id,terms:[past,now,next]};
}
function fixClass(c){
  c.id=c.id||uid();
  c.components=Array.isArray(c.components)?c.components:[];
  c.reqs=Array.isArray(c.reqs)?c.reqs:[];
  c.scale=Array.isArray(c.scale)&&c.scale.length?c.scale:defaultScale();
  c.final=num(c.final);
  c.notes=typeof c.notes==="string"?c.notes:"";
  c.links=Array.isArray(c.links)?c.links:[];
  c.excluded=!!c.excluded;
  c.major=!!c.major;
  c.meets=Array.isArray(c.meets)?c.meets:[]; /* weekly meeting times */
  c.meets.forEach(function(m){m.id=m.id||uid();m.days=Array.isArray(m.days)?m.days:[]}); /* true = part of the major average (for example EWA) */ /* true = left out of the GWA and the unit total */
}
function clean(s){
  if(!s)return null;
  if(!Array.isArray(s.terms)){
    if(!Array.isArray(s.classes))return null;
    var t=newTerm("Current semester");t.classes=s.classes;
    s.terms=[t];s.currentTermId=t.id;delete s.classes;
  }
  s.v=2;s.target=num(s.target)||1.75;
  s.unitsRequired=num(s.unitsRequired);if(s.unitsRequired==null)s.unitsRequired=166;
  s.program=s.program||"";
  s.majorLabel=typeof s.majorLabel==="string"&&s.majorLabel?s.majorLabel:"Major GWA";
  s.majorReq=num(s.majorReq);
  if(!Array.isArray(s.categories))s.categories=[{id:uid(),name:"Academics",color:PALETTE[0][1]},{id:uid(),name:"Org",color:PALETTE[1][1]},{id:uid(),name:"Personal",color:PALETTE[2][1]}];
  s.categories.forEach(function(k){k.id=k.id||uid();k.color=k.color||PALETTE[0][1];k.hidden=!!k.hidden});
  s.events=Array.isArray(s.events)?s.events:[];
  s.hideDue=!!s.hideDue;
  var hn=s.honors||{};
  s.honors={summa:num(hn.summa)||1.25,magna:num(hn.magna)||1.45,cum:num(hn.cum)||1.75};
  if(!s.terms.length)s.terms.push(newTerm("Current semester"));
  s.terms.forEach(function(t){t.id=t.id||uid();t.name=t.name||"";t.classes=Array.isArray(t.classes)?t.classes:[];t.classes.forEach(fixClass)});
  if(!s.terms.some(function(t){return t.id===s.currentTermId}))s.currentTermId=s.terms[s.terms.length-1].id;
  return s;
}

/* ---- grade maths ---- */
function compPct(cls,comp){
  var s=0,m=0;
  cls.reqs.forEach(function(r){if(r.compId===comp.id&&r.score!=null&&r.max>0){s+=r.score;m+=r.max}});
  return m>0?s/m*100:null;
}
function gradeFor(p,scale){
  var s=scale.slice().sort(function(a,b){return b.min-a.min});
  for(var i=0;i<s.length;i++){if(p+1e-9>=s[i].min)return s[i].grade}
  return 5;
}
function stats(cls){
  var total=0,gw=0,earned=0,per={};
  cls.components.forEach(function(c){
    var w=+c.weight||0;total+=w;
    var p=compPct(cls,c);per[c.id]=p;
    if(p!=null){gw+=w;earned+=w*p/100}
  });
  var standing=gw>0?earned/gw*100:null;
  return{total:total,gw:gw,earned:earned,remaining:total-gw,per:per,standing:standing,
    grade:standing==null?null:gradeFor(standing,cls.scale)};
}
/* A class counts with its final grade if one is entered, otherwise with its projection */
function classGrade(c){return c.final!=null?c.final:stats(c).grade}
function gwaOf(classes){
  var u=0,s=0,n=0;
  classes.forEach(function(c){if(c.excluded)return;var g=classGrade(c),un=+c.units||0;if(g!=null&&un>0){u+=un;s+=un*g;n++}});
  return{value:u>0?s/u:null,counted:n,units:u};
}
function ci(){for(var i=0;i<state.terms.length;i++){if(state.terms[i].id===state.currentTermId)return i}return 0}
function statusOf(i){var c=ci();return i<c?"past":i===c?"present":"planned"}
function cumulative(){
  var c=ci(),all=[];
  state.terms.forEach(function(t,i){if(i<=c)all=all.concat(t.classes)});
  return gwaOf(all);
}
function unitSummary(){
  var c=ci(),e=0,p=0,f=0;
  state.terms.forEach(function(t,i){t.classes.forEach(function(k){
    if(k.excluded)return;
    var u=+k.units||0;
    if(i>c){f+=u;return}
    var g=i<c?classGrade(k):k.final;
    if(g!=null){if(g<=3)e+=u}
    else if(i===c)p+=u;
  })});
  return{earned:e,inprog:p,planned:f};
}
/* Major average: only classes switched on as Major, up to the present semester */
function majorStat(){
  var c=ci(),u=0,s=0,n=0,marked=0;
  state.terms.forEach(function(t,i){if(i<=c)t.classes.forEach(function(k){
    if(!k.major)return;marked++;
    var g=classGrade(k),un=+k.units||0;
    if(g!=null&&un>0){u+=un;s+=un*g;n++}
  })});
  return{value:u>0?s/u:null,counted:n,units:u,marked:marked};
}
function majorHtml(){
  var m=majorStat(),req=state.majorReq;
  if(!m.marked)return"";
  var pill="";
  if(req!=null&&m.value!=null)pill=m.value<=req+1e-9?'<span class="pill good">Meets the '+f2(req)+' requirement</span>':'<span class="pill crit">Short of the '+f2(req)+' requirement</span>';
  return '<div class="major"><span class="m-k">'+esc(state.majorLabel)+'</span><b class="num">'+(m.value==null?"–":m.value.toFixed(3))+'</b>'+
    '<span class="muted small">'+m.counted+' graded major '+(m.counted===1?"class":"classes")+', '+fu(m.units)+' units</span>'+pill+'</div>';
}
/* Latin honors: a GWA at or below each cutoff qualifies */
function honorOf(g){
  var H=state.honors,tiers=[["Summa cum laude",H.summa],["Magna cum laude",H.magna],["Cum laude",H.cum]];
  var have=null,next=null;
  for(var i=0;i<tiers.length;i++){
    if(g<=tiers[i][1]+1e-9){have=tiers[i][0];break}
    next={name:tiers[i][0],gap:g-tiers[i][1]};
  }
  return{have:have,next:next};
}
function honorHtml(g){
  if(g==null)return"";
  var h=honorOf(g);
  /* Shown only when the GWA qualifies. No honors, no label. */
  return h.have?'<span class="pill good">'+h.have+'</span>':"";
}
function sumUnits(t){var u=0;t.classes.forEach(function(k){if(!k.excluded)u+=(+k.units||0)});return u}
function parseDate(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function dayDiff(s){var t=new Date();t.setHours(0,0,0,0);return Math.round((parseDate(s)-t)/864e5)}
function whenLabel(s){
  var d=dayDiff(s);
  if(d<0)return{t:"Overdue "+(-d)+" d",late:true};
  if(d===0)return{t:"Today",late:false};
  if(d===1)return{t:"Tomorrow",late:false};
  if(d<=14)return{t:"in "+d+" d",late:false};
  return{t:parseDate(s).toLocaleDateString(undefined,{month:"short",day:"numeric"}),late:false};
}
function reqStatus(r){
  if(r.score!=null)return["good","Graded"];
  if(r.done)return["plain","Submitted"];
  if(r.due&&dayDiff(r.due)<0)return["crit","Overdue"];
  return["warn","To do"];
}
function f2(n){return n.toFixed(2)}
function f1(n){return(Math.round(n*10)/10).toFixed(1)}
function fu(n){return String(Math.round(n*10)/10)}
function openDue(t){
  var due=[];
  t.classes.forEach(function(c){c.reqs.forEach(function(r){if(r.due&&!r.done&&r.score==null)due.push({c:c,r:r})})});
  due.sort(function(a,b){return a.r.due<b.r.due?-1:a.r.due>b.r.due?1:0});
  return due;
}

/* ---- lookups ---- */
function byId(arr,id){return arr.filter(function(x){return x.id===id})[0]}
function termSel(){return byId(state.terms,selTerm)||state.terms[ci()]}
function cur(){return byId(termSel().classes,selected)}
function findClass(id){
  for(var i=0;i<state.terms.length;i++){var c=byId(state.terms[i].classes,id);if(c)return{term:state.terms[i],cls:c}}
  return null;
}

/* ---- rendering ---- */
function render(){
  var fid=document.activeElement&&document.activeElement.id;
  if(!state){app.innerHTML='<p class="muted">Loading your classes…</p>';return}
  if(!byId(state.terms,selTerm))selTerm=state.currentTermId;
  var t=termSel();
  if(!byId(t.classes,selected))selected=t.classes.length?t.classes[0].id:null;
  app.className="app"+(loading?" loading":"");
  var v=view();
  if(v==="home"){app.innerHTML=landingHtml();return}
  app.innerHTML=topHtml()+gradHtml()+noticeHtml()+tabsHtml(v)+
    (v==="plan"?planHtml():v==="schedule"?scheduleHtml():'<div class="cols" data-lock><aside class="rail">'+railHtml(t)+'</aside><main>'+sheetHtml(t)+'</main></div>')+footHtml();
  if(fid){var el=document.getElementById(fid);if(el){try{el.focus()}catch(e){}}}
}
function logoHtml(){
  /* The 1 wearing a small graduation cap, then the rest of the name */
  return '<svg class="logo-1" viewBox="0 0 40 80" role="img" aria-label="1"><line x1="26" y1="31" x2="11" y2="44" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round"/><rect x="20" y="24" width="14" height="56" rx="4" style="fill:var(--accent)"/><g transform="rotate(-8 27 14)"><rect x="18" y="13" width="18" height="11" rx="4" style="fill:var(--green)"/><polygon points="27,4 47,12 27,20 7,12" style="fill:var(--green)"/><line x1="44" y1="13" x2="44" y2="25" stroke="#e0a526" stroke-width="2.2" stroke-linecap="round"/><circle cx="44" cy="28" r="3" fill="#e0a526"/></g></svg>'+
    '<span>'+esc(NAME.replace(/^1/,""))+'</span>';
}
function landingHtml(){
  var g=cumulative(),has=g.value!=null,u=unitSummary(),t=state.terms[ci()];
  var rows=t.classes.slice(0,4).map(function(c){var gr=classGrade(c);
    return '<li><span>'+esc(c.code||"Untitled")+'</span><b class="num">'+(gr==null?"–":f2(gr))+'</b></li>'}).join("");
  var nx=openDue(t)[0];
  return '<nav class="l-nav"><a class="logo" href="#home">'+logoHtml()+'</a><span class="term-actions">'+themeBtn()+'<a class="cta sm" href="#tracker">Open my tracker</a></span></nav>'+
  '<section class="hero"><div class="hero-copy">'+
    '<span class="badge"><b>Private</b>Your grades are visible only to you</span>'+
    '<h2>Track every requirement.<em>Land closer to uno.</em></h2>'+
    '<p class="lead">One place for your classes, grading weights, deadlines, schedule and whole curriculum, so your GWA is never a surprise.</p>'+
    '<div class="hero-actions"><a class="cta" href="#tracker">Open my tracker</a>'+
      '<span class="muted small">'+fu(u.earned)+' of '+fu(state.unitsRequired)+' units earned'+(state.example?" (sample data)":"")+'</span></div>'+
    '<p class="byline">by '+esc(AUTHOR)+'</p></div>'+
    '<aside class="preview" aria-label="Your numbers right now">'+
      '<div><div class="k">Cumulative GWA'+(state.example?" (sample)":"")+'</div><div class="big">'+(has?g.value.toFixed(3):"–")+'</div>'+
      '<div class="k">Target '+f2(state.target)+'</div>'+(honorHtml(g.value)?'<div class="verdict" style="margin-top:8px">'+honorHtml(g.value)+'</div>':'')+'</div>'+
      '<div class="k">'+esc(t.name||"This semester")+'</div>'+
      (rows?'<ul>'+rows+'</ul>':'<p class="muted small" style="margin:0">No classes this semester yet. Open the tracker to add one.</p>')+
      '<div class="next"><span class="k">Due next</span>'+(nx?'<b>'+esc(nx.r.name||"Untitled")+'</b><span class="muted small">'+esc(nx.c.code)+', '+whenLabel(nx.r.due).t.toLowerCase()+'</span>':'<span class="muted small">Nothing waiting.</span>')+'</div>'+
    '</aside></section>'+
  '<section class="steps">'+
    '<div class="step"><span class="n">1</span><h3>Map your curriculum</h3><p>Set the units you need to graduate, then lay out past, present and future semesters.</p></div>'+
    '<div class="step"><span class="n">2</span><h3>Track this semester</h3><p>Grading weights, requirements and due dates for every class you are taking now.</p></div>'+

/* ---------- Schedule tab: weekly timetable + calendar ---------- */
function mins(t){if(!t)return null;var p=String(t).split(":"),m=(+p[0])*60+(+p[1]);return isFinite(m)?m:null}
function t12(t){var m=mins(t);if(m==null)return"";var hh=Math.floor(m/60),mm=m%60,ap=hh>=12?"PM":"AM";hh=hh%12||12;return hh+":"+String(mm).padStart(2,"0")+" "+ap}
function classColor(t,c){return PALETTE[Math.max(0,t.classes.indexOf(c))%PALETTE.length][1]}
function weekHtml(){
  var t=state.terms[ci()],blocks=[],lo=1440,hi=0,used={};
  t.classes.forEach(function(c){(c.meets||[]).forEach(function(m){
    var s=mins(m.start),e=mins(m.end);if(s==null||e==null||e<=s||!m.days.length)return;
    m.days.forEach(function(d){blocks.push({d:d,s:s,e:e,c:c,m:m});used[d]=1});
    lo=Math.min(lo,s);hi=Math.max(hi,e);
  })});
  if(!blocks.length)return '<div class="empty"><p class="muted">No class times yet. Open a class in the Classes tab and fill in its Class schedule. Your weekly timetable builds itself from there.</p><a class="btn primary" href="#tracker" style="text-decoration:none">Go to Classes</a></div>';
  var days=[1,2,3,4,5];if(used[6]||used[0])days.push(6);if(used[0])days.push(0);
  var h0=Math.floor(lo/60),h1=Math.ceil(hi/60),H=56,height=(h1-h0)*H,labels="",today=new Date().getDay();
  for(var hr=h0;hr<=h1;hr++)labels+='<span style="top:'+((hr-h0)*H)+'px">'+t12(String(hr).padStart(2,"0")+":00")+'</span>';
  var cols=days.map(function(d){
    var list=blocks.filter(function(b){return b.d===d}).sort(function(a,b){return a.s-b.s}),lanes=[];
    list.forEach(function(b){var i=0;while(i<lanes.length&&lanes[i]>b.s)i++;lanes[i]=b.e;b.lane=i});
    var n=Math.max(1,lanes.length);
    return '<div class="wk-col"><div class="wk-day'+(d===today?" today":"")+'">'+DAYS[d]+'</div><div class="wk-body" style="height:'+height+'px">'+
      list.map(function(b){
        return '<button class="wk-block" data-a="open-class" data-id="'+b.c.id+'" title="Open '+esc(b.c.code)+'" style="top:'+((b.s-h0*60)/60*H)+'px;height:'+((b.e-b.s)/60*H)+'px;left:'+(b.lane/n*100)+'%;width:'+(100/n)+'%;--c:'+classColor(t,b.c)+'">'+
          '<b>'+esc(b.c.code||"Untitled")+'</b><span>'+t12(b.m.start)+' to '+t12(b.m.end)+'</span>'+(b.m.room?'<span>'+esc(b.m.room)+'</span>':'')+'</button>';
      }).join("")+'</div></div>';
  }).join("");
  return '<div class="wk-wrap"><div class="wk" style="grid-template-columns:70px repeat('+days.length+',minmax(104px,1fr))">'+
    '<div class="wk-col"><div class="wk-day">&nbsp;</div><div class="wk-body wk-times" style="height:'+height+'px">'+labels+'</div></div>'+cols+'</div></div>';
}
/* Everything that falls on one date */
function itemsOn(d,withClasses){
  var out=[],wd=parseDate(d).getDay();
  if(withClasses){
    var t=state.terms[ci()];
    t.classes.forEach(function(c){(c.meets||[]).forEach(function(m){
      if(m.days.indexOf(wd)>=0&&mins(m.start)!=null)out.push({kind:"class",title:c.code||"Untitled",sub:t12(m.start)+(m.end?" to "+t12(m.end):"")+(m.room?", "+m.room:""),color:classColor(t,c),sort:mins(m.start),id:c.id});
    })});
  }
  if(!state.hideDue)state.terms.forEach(function(t){t.classes.forEach(function(c){c.reqs.forEach(function(r){
    if(r.due===d)out.push({kind:"due",title:r.name||"Untitled",sub:c.code,color:"var(--accent)",sort:-1,id:c.id,done:r.done||r.score!=null});
  })})});
  state.events.forEach(function(e){
    if(e.date!==d)return;
    var k=byId(state.categories,e.catId);if(k&&k.hidden)return;
    out.push({kind:"event",title:e.title||"Untitled event",color:k?k.color:"#5b665e",sort:mins(e.start)==null?-2:mins(e.start),ev:e,cat:k});
  });
  return out.sort(function(a,b){return a.sort-b.sort});
}

/* ---- saving ---- */
function touch(){
  if(state.example)delete state.example;
  dirty=true;saveState="saving";
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
function flush(){
  if(writing)return;
  writing=true;
  var failed=false;
  (function loop(){
    if(!dirty){writing=false;saveState=failed?"error":"idle";renderFoot();return}
    dirty=false;
    var body=JSON.stringify(state),localOk=true;
    try{localStorage.setItem(KEY,body)}catch(e){localOk=false}
    if(mode==="cloud"&&docRef){
      docRef.set({json:body,updatedAt:new Date().toISOString()}).then(function(){failed=false;loop()},function(){mode="local";failed=!localOk;loop()});
    }else{failed=!localOk;loop()}
  })();
}
function renderFoot(){var f=app.querySelector(".foot");if(f)f.outerHTML=footHtml()}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error("timeout"))},ms);p.then(function(v){clearTimeout(t);res(v)},function(e){clearTimeout(t);rej(e)})})}
function safeUrl(u){
  u=String(u||"").trim();if(!u)return"";
  if(!/^https?:\/\//i.test(u)){if(/^[a-z][a-z0-9+.-]*:/i.test(u))return"";u="https://"+u}
  return u;
}
function gradeIn(v){var g=num(v);return g==null?null:Math.max(1,Math.min(5,g))}

  else if(!c){changed=false}
  else if(a==="add-comp"){x={id:uid(),name:"",weight:0};c.components.push(x);focusId="k-"+x.id+"-n"}
  else if(a==="del-comp"){c.components=c.components.filter(function(k){return k.id!==id});c.reqs.forEach(function(r){if(r.compId===id)r.compId=null})}
  else if(a==="add-req"){x={id:uid(),name:"",compId:c.components.length?c.components[0].id:null,score:null,max:100,due:"",done:false};c.reqs.push(x);focusId="r-"+x.id+"-n"}
  else if(a==="del-req")c.reqs=c.reqs.filter(function(k){return k.id!==id});
  else if(a==="add-meet"){x={id:uid(),days:[],start:"",end:"",room:""};c.meets.push(x)}
  else if(a==="del-meet")c.meets=c.meets.filter(function(k){return k.id!==id});
  else if(a==="toggle-day"){x=byId(c.meets,id);if(x){i=x.days.indexOf(+b.dataset.d);if(i<0)x.days.push(+b.dataset.d);else x.days.splice(i,1)}}
  else if(a==="add-link"){x={id:uid(),label:"",url:""};c.links.push(x);focusId="l-"+x.id+"-n"}
  else if(a==="del-link")c.links=c.links.filter(function(k){return k.id!==id});
  else if(a==="add-scale")c.scale.push({grade:4,min:55});
  else if(a==="del-scale")c.scale.splice(+id,1);
  else if(a==="reset-scale")c.scale=defaultScale();
  else changed=false;
  if(!asks)confirmDel=null;
  if(changed)touch();
  render();
  if(focusId){var el=document.getElementById(focusId);if(el){el.focus();if(sel&&el.select)el.select()}}
});

/* ---- start ---- */
function start(){
  /* Light is the default. Dark only if you chose it before. */
  try{if(localStorage.getItem(KEY+"-theme")==="dark")document.documentElement.dataset.mode="dark"}catch(e){}
  var cached=null;
  try{cached=clean(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
  state=cached||clean(exampleState());
  render();
  var use=window.claude&&typeof window.claude.use==="function"?window.claude.use("db"):Promise.resolve(null);
  Promise.resolve(use).catch(function(){return null}).then(function(db){
    if(!db)return;
    docRef=db.doc("tracker/main");
    return withTimeout(docRef.get(),10000).then(function(snap){
      mode="cloud";
      if(snap&&snap.exists){
        var d=snap.data(),s=null;
        try{s=clean(d&&d.json?JSON.parse(d.json):null)}catch(e){}
        if(s)state=s;
      }else if(cached){dirty=true}
    },function(){mode="local"});
  }).then(function(){
    loading=false;render();
    if(dirty)flush();
  });
}
window.addEventListener("hashchange",function(){confirmDel=null;render();window.scrollTo(0,0)});
start();
})();
</script>
